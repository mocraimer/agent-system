name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The CLI must start from a clean state directory and refuse to run anything,
      # since a fresh install has no approvals and no grants. A build that dispatched
      # work here would have lost the property the whole design rests on.
      - name: Refuse to dispatch on a fresh install
        env:
          AGENTSYS_STATE: ${{ runner.temp }}/agentsys-fresh
        run: |
          node dist/cli/main.js init --operator ci@example.test
          set +e
          # A valid estimate is supplied deliberately: without it admission would
          # also refuse, and the test could pass while the authority check was
          # broken. This way authority is the only thing that can stop it.
          out=$(node dist/cli/main.js dispatch \
            --task ci-smoke --repo mocraimer/agent-system --class ci-repair \
            --runtime pi-local --profile default --actions author-changes \
            --estimate-five-hour 1 --estimate-weekly 1 --estimate-basis operator-bound \
            --estimate-detail "smoke test bound" \
            --prompt "should not run")
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: an unauthorized dispatch exited 0"
            exit 1
          fi
          echo "$out" | grep -q "Awaiting approval" || {
            echo "FAIL: expected the dispatch to be held for approval"
            exit 1
          }
          echo "$out" | grep -q "there are no grants" || {
            echo "FAIL: the refusal did not come from the authority check"
            exit 1
          }
          if echo "$out" | grep -q "Waiting on subscription allowance"; then
            echo "FAIL: admission refused first; this test cannot see the authority check"
            exit 1
          fi
